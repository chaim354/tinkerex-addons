server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The Rails app fetches manifests.json and each addon's assets. Everything here is public static
  # JS; there is nothing to authenticate, and the container is not internet-reachable.
  #
  # `no-cache` is deliberate: Rails does not cache proxied assets (Phase A left that out on purpose),
  # so a stale copy here would be the only stale copy — and a stale bundle reads as "my fix didn't
  # deploy", which is worse than a slow one.
  location / {
    autoindex off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
}
